[package]
name = "gray-gchat"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "gchat plugin for the gray agent harness"
license = "MIT"
[lib]
name = "gchat_plugin"
path = "src/lib.rs"
[[bin]]
name = "gchat"
path = "src/main.rs"
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
